<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>mein-os Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #131313;
    --border: #232323;
    --text: #e8e8e8;
    --text-dim: #888;
    --accent: #22c55e;
    --accent-dim: #16321f;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  /* Login */
  #login { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
  #login h1 { color: var(--accent); font-size: 22px; margin: 0; }
  #login input { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 8px; font-size: 16px; width: 240px; }
  #login button { background: var(--accent); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
  #login .err { color: var(--danger); font-size: 13px; height: 16px; }

  /* Layout */
  #dashboard { display: none; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 18px; margin: 0; color: var(--accent); letter-spacing: 0.5px; }

  .level-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .level-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .level-num { font-size: 26px; font-weight: 700; color: var(--accent); }
  .level-label { color: var(--text-dim); font-size: 12px; }
  .bar-bg { background: #1a1a1a; border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; transition: width 0.4s; }
  .streak { margin-top: 10px; font-size: 13px; color: var(--text-dim); }

  section { margin-bottom: 24px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .card + .card { margin-top: 8px; }

  .metric-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
  .metric-row .val { color: var(--accent); font-weight: 600; }

  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  ul.plain li:last-child { border-bottom: none; }
  .muted { color: var(--text-dim); font-size: 12px; }

  .badge { display: inline-block; background: var(--accent-dim); color: var(--accent); font-size: 11px; padding: 3px 8px; border-radius: 6px; margin: 2px 4px 2px 0; }

  .collapsible-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .collapsible-content { display: none; margin-top: 10px; }
  .collapsible-content.open { display: block; }
  .chevron { transition: transform 0.2s; color: var(--text-dim); }
  .chevron.open { transform: rotate(90deg); }

  .plan-text { white-space: pre-wrap; font-size: 13px; line-height: 1.5; color: var(--text); max-height: 300px; overflow-y: auto; }

  .photo-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .photo-strip img { width: 80px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }

  canvas { max-width: 100%; }
</style>
</head>
<body>

<div id="login">
  <h1>🔒 mein-os</h1>
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" />
  <button onclick="tryLogin()">Öffnen</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="dashboard">
  <div class="wrap">
    <div class="header">
      <h1>MEIN-OS</h1>
      <span class="muted" id="dateNow"></span>
    </div>

    <div class="level-card">
      <div class="level-row">
        <div><span class="level-num" id="levelNum">1</span><span class="level-label"> Level</span></div>
        <div class="muted" id="xpLabel">0 XP</div>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="xpBar" style="width:0%"></div></div>
      <div class="streak" id="streakLabel"></div>
    </div>

    <section>
      <h2>Übersicht</h2>
      <div class="card">
        <div id="topTasks"><span class="muted">Lade...</span></div>
      </div>
    </section>

    <section>
      <h2>Ernährung heute</h2>
      <div class="card">
        <div class="metric-row"><span>Kalorien</span><span class="val" id="calRow">-</span></div>
        <div class="bar-bg" style="margin-bottom:12px"><div class="bar-fill" id="calBar" style="width:0%"></div></div>
        <div class="metric-row"><span>Protein</span><span class="val" id="proteinRow">-</span></div>
        <div class="bar-bg"><div class="bar-fill" id="proteinBar" style="width:0%"></div></div>
      </div>
      <div class="card">
        <ul class="plain" id="mealsList"></ul>
      </div>
    </section>

    <section>
      <h2>Training</h2>
      <div class="card">
        <div id="trainingGoalsBox"></div>
      </div>
      <div class="card">
        <canvas id="weightChart" height="140"></canvas>
      </div>
      <div class="card">
        <div class="muted" style="margin-bottom:8px">Fortschrittsfotos</div>
        <div class="photo-strip" id="photoStrip"></div>
      </div>
      <div class="card collapsible-header" onclick="toggle('planBox')">
        <span>Aktueller Trainingsplan</span>
        <span class="chevron" id="planBox-chevron">›</span>
      </div>
      <div class="card collapsible-content" id="planBox-content">
        <div class="plan-text" id="planText"></div>
      </div>
    </section>

    <section>
      <h2>Charakter & Journal</h2>
      <div class="card">
        <div id="traitsBox"></div>
      </div>
      <div class="card">
        <ul class="plain" id="journalList"></ul>
      </div>
    </section>

    <section>
      <div class="collapsible-header" onclick="toggle('financeBox')">
        <h2 style="margin:0">Finanzen</h2>
        <span class="chevron" id="financeBox-chevron">›</span>
      </div>
      <div class="collapsible-content" id="financeBox-content">
        <div class="card" id="financeSummary"></div>
        <div class="card">
          <div class="muted" style="margin-bottom:8px">Fixkosten</div>
          <ul class="plain" id="fixedCostsList"></ul>
        </div>
        <div class="card">
          <div class="muted" style="margin-bottom:8px">Schulden</div>
          <ul class="plain" id="debtsList"></ul>
        </div>
      </div>
    </section>

    <section>
      <h2>Aufgaben</h2>
      <div class="card">
        <ul class="plain" id="tasksList"></ul>
      </div>
    </section>
  </div>
</div>

<script>
const API = "/api/dashboard-data";

function toggle(id) {
  document.getElementById(id + "-content").classList.toggle("open");
  document.getElementById(id + "-chevron").classList.toggle("open");
}

async function tryLogin() {
  const pw = document.getElementById("pw").value;
  const errEl = document.getElementById("loginErr");
  errEl.textContent = "";
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    if (!res.ok) {
      errEl.textContent = "Falsches Passwort";
      return;
    }
    const data = await res.json();
    localStorage.setItem("dashboard_pw", pw);
    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    render(data);
  } catch (e) {
    errEl.textContent = "Fehler beim Laden";
  }
}

function render(data) {
  document.getElementById("dateNow").textContent = new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });

  // Level / XP
  document.getElementById("levelNum").textContent = data.level;
  document.getElementById("xpLabel").textContent = data.xp + " XP";
  document.getElementById("xpBar").style.width = data.xpIntoLevel + "%";
  document.getElementById("streakLabel").textContent = data.streak > 0 ? `🔥 ${data.streak} Tage Check-in-Streak` : "Noch kein Check-in-Streak";

  // Übersicht: Top 3 offene Aufgaben
  const topTasksEl = document.getElementById("topTasks");
  const openTasks = data.tasks || [];
  topTasksEl.innerHTML = openTasks.length
    ? openTasks.slice(0, 3).map(t => `<div style="margin-bottom:6px">• ${esc(t.title)} ${t.priority ? `<span class="badge">${esc(t.priority)}</span>` : ""}</div>`).join("")
    : `<span class="muted">Keine offenen Aufgaben 🎉</span>`;

  // Ernährung
  const goal = data.nutritionGoals || {};
  const totalCal = (data.nutritionToday || []).reduce((s, m) => s + (m.calories || 0), 0);
  const totalProtein = (data.nutritionToday || []).reduce((s, m) => s + (m.protein_g || 0), 0);
  const calGoal = goal.daily_calorie_target || 0;
  const proteinGoal = goal.daily_protein_target || 0;
  document.getElementById("calRow").textContent = `${totalCal} / ${calGoal || "?"} kcal`;
  document.getElementById("calBar").style.width = calGoal ? Math.min(100, (totalCal / calGoal) * 100) + "%" : "0%";
  document.getElementById("proteinRow").textContent = `${totalProtein} / ${proteinGoal || "?"} g`;
  document.getElementById("proteinBar").style.width = proteinGoal ? Math.min(100, (totalProtein / proteinGoal) * 100) + "%" : "0%";

  const mealsList = document.getElementById("mealsList");
  mealsList.innerHTML = (data.nutritionToday || []).length
    ? data.nutritionToday.map(m => `<li>${esc(m.description || "Mahlzeit")} <span class="muted">- ${m.calories || 0} kcal, ${m.protein_g || 0}g Protein</span></li>`).join("")
    : `<li class="muted">Heute noch nichts geloggt</li>`;

  // Training - Ziele
  const goalsBox = document.getElementById("trainingGoalsBox");
  goalsBox.innerHTML = (data.trainingGoals || []).length
    ? data.trainingGoals.map(g => `<div class="metric-row"><span>${g.notes && g.notes.length < 40 ? esc(g.notes) : "Ziel"}</span><span class="val">${g.target_weight_kg || "?"}kg @ ${g.target_body_fat_percent || "?"}%</span></div>`).join("")
    : `<span class="muted">Kein Trainingsziel hinterlegt</span>`;

  // Gewichts-/KFA-Chart
  const bm = [...(data.bodyMetrics || [])].reverse();
  if (bm.length && window.Chart) {
    new Chart(document.getElementById("weightChart"), {
      type: "line",
      data: {
        labels: bm.map(b => new Date(b.logged_at).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })),
        datasets: [
          { label: "Gewicht (kg)", data: bm.map(b => b.weight_kg), borderColor: "#22c55e", backgroundColor: "transparent", tension: 0.3, yAxisID: "y" },
          { label: "KFA (%)", data: bm.map(b => b.body_fat_percent), borderColor: "#888", backgroundColor: "transparent", tension: 0.3, yAxisID: "y1" },
        ],
      },
      options: {
        plugins: { legend: { labels: { color: "#e8e8e8" } } },
        scales: {
          x: { ticks: { color: "#888" }, grid: { color: "#232323" } },
          y: { ticks: { color: "#888" }, grid: { color: "#232323" }, position: "left" },
          y1: { ticks: { color: "#888" }, grid: { display: false }, position: "right" },
        },
      },
    });
  }

  // Fotos
  const photos = (data.bodyMetrics || []).filter(b => b.photo_url);
  document.getElementById("photoStrip").innerHTML = photos.length
    ? photos.map(p => `<a href="${p.photo_url}" target="_blank"><img src="${p.photo_url}" /></a>`).join("")
    : `<span class="muted">Noch keine Fotos</span>`;

  // Trainingsplan
  document.getElementById("planText").textContent = data.trainingPlan ? data.trainingPlan.plan_text : "Kein aktiver Plan.";

  // Charaktereigenschaften: letzte Note pro Eigenschaft
  const traitsBox = document.getElementById("traitsBox");
  const latestByTrait = {};
  for (const c of data.personalityCheckins || []) {
    const name = c.personality_traits ? c.personality_traits.name : "?";
    if (!latestByTrait[name] || c.logged_at > latestByTrait[name].logged_at) latestByTrait[name] = c;
  }
  const traitEntries = Object.entries(latestByTrait);
  traitsBox.innerHTML = traitEntries.length
    ? traitEntries.map(([name, c]) => `<div class="metric-row"><span>${esc(name)}</span><span class="val">Note ${c.note}</span></div>`).join("")
    : `<span class="muted">Noch keine Check-ins</span>`;

  // Journal
  const journalList = document.getElementById("journalList");
  journalList.innerHTML = (data.journalEntries || []).length
    ? data.journalEntries.slice(0, 8).map(j => `<li>${esc(j.summary || j.raw_text || "")} <span class="muted">- ${new Date(j.created_at).toLocaleDateString("de-DE")}</span></li>`).join("")
    : `<li class="muted">Noch keine Einträge</li>`;

  // Finanzen
  const totalFixed = (data.fixedCosts || []).reduce((s, f) => s + Number(f.betrag) / (f.rhythmus === "jährlich" ? 12 : 1), 0);
  const totalDebtRemaining = (data.debts || []).reduce((s, d) => s + Number(d.restbetrag || 0), 0);
  const totalIncomeMonth = (data.income || []).reduce((s, i) => s + Number(i.amount || 0), 0);
  const totalExpensesMonth = (data.expenses || []).reduce((s, e) => s + Number(e.amount || 0), 0);
  document.getElementById("financeSummary").innerHTML = `
    <div class="metric-row"><span>Fixkosten (monatl. Ø)</span><span class="val">${totalFixed.toFixed(0)} €</span></div>
    <div class="metric-row"><span>Schulden gesamt</span><span class="val">${totalDebtRemaining.toFixed(0)} €</span></div>
    <div class="metric-row"><span>Einnahmen (Monat)</span><span class="val">${totalIncomeMonth.toFixed(0)} €</span></div>
    <div class="metric-row"><span>Ausgaben (Monat)</span><span class="val">${totalExpensesMonth.toFixed(0)} €</span></div>
  `;

  document.getElementById("fixedCostsList").innerHTML = (data.fixedCosts || []).length
    ? data.fixedCosts.map(f => `<li>${esc(f.name)} <span class="muted">(${esc(f.kategorie || "-")})</span> <span class="val" style="float:right">${f.betrag}€ / ${esc(f.rhythmus)}</span></li>`).join("")
    : `<li class="muted">Keine Fixkosten hinterlegt</li>`;

  document.getElementById("debtsList").innerHTML = (data.debts || []).length
    ? data.debts.map(d => {
        const pct = d.original_betrag ? Math.round(((d.original_betrag - d.restbetrag) / d.original_betrag) * 100) : 0;
        return `<li>${esc(d.name)} - ${d.restbetrag}€ offen <span class="muted">(${pct}% abbezahlt)</span></li>`;
      }).join("")
    : `<li class="muted">Keine Schulden hinterlegt</li>`;

  // Aufgaben (alle offenen)
  const tasksList = document.getElementById("tasksList");
  tasksList.innerHTML = (data.tasks || []).length
    ? data.tasks.map(t => `<li>${esc(t.title)} ${t.category ? `<span class="badge">${esc(t.category)}</span>` : ""}</li>`).join("")
    : `<li class="muted">Keine offenen Aufgaben 🎉</li>`;
}

function esc(str) {
  if (str == null) return "";
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Automatisch einloggen, falls Passwort schon gespeichert ist
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("dashboard_pw");
  if (saved) {
    document.getElementById("pw").value = saved;
    tryLogin();
  }
});
</script>

</body>
</html>
